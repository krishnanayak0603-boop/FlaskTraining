<link rel="stylesheet" href="/static/style.css">
<div class="box">
  <h2>Book Issue Form</h2>
  <form method="post">
    Book ID <input name="book_id" placeholder="Enter book ID" required>
    Book Name <input name="book_name" placeholder="Enter book name" required>
    Book Number <input name="book_number" placeholder="Enter book number" required>
    Name of Student <input name="student_name" placeholder="Enter student name" required>
    Issue Date <input name="issue_date" type="date" required>
    Due Date <input name="due_date" type="date" required>
    <button class="blue">Submit</button>
  </form>
  <p><a href="/dashboard">Back to Dashboard</a></p>
</div>
