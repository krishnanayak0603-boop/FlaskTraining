<link rel="stylesheet" href="/static/style.css">
<div class="box">
  <h2>Sign Up</h2>
  <form method="post">
    Name <input name="name" placeholder="Enter name" required>
    Username <input name="username" placeholder="Enter username" required>
    Password <input name="password" type="password" placeholder="Enter password" required>
    <button class="blue">Create Account</button>
  </form>
  <p><a href="/login">Already have an account? Login</a></p>
</div>
