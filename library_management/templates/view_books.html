<link rel="stylesheet" href="/static/style.css">
<div class="box wide">
  <h2>Book Details / List Page</h2>
  <table>
    <tr><th>Book ID</th><th>Book Name</th><th>Book Number</th>
        <th>Name of Student</th><th>Issue Date</th><th>Due Date</th></tr>
    {% for b in books %}
    <tr>
      <td>{{ b.book_id }}</td><td>{{ b.book_name }}</td><td>{{ b.book_number }}</td>
      <td>{{ b.student_name }}</td><td>{{ b.issue_date }}</td><td>{{ b.due_date }}</td>
    </tr>
    {% endfor %}
  </table>
  <a class="btn blue" href="/dashboard">Back to Dashboard</a>
</div>
